<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21132f">
<title>Sign in · Wellbeing</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;background:#170f22;color:#f3ecfa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,#56356f 0,transparent 42%),linear-gradient(145deg,#170f22,#21132f 55%,#160f20)}
main{width:min(100%,420px);padding:34px;border:1px solid #674b7d;border-radius:25px;background:linear-gradient(160deg,#30203fdd,#241832f5);box-shadow:0 24px 80px #09050e80}
.mark{width:54px;height:54px;display:grid;place-items:center;border-radius:18px;background:#503466;color:#e8d5ff;font-size:27px;box-shadow:inset 0 0 0 1px #8865a5;margin-bottom:23px}
.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c5a9e2;font-weight:800}h1{font-size:28px;letter-spacing:-.8px;margin:8px 0}p{color:#bbaec8;font-size:13px;line-height:1.6;margin:0 0 24px}
label{display:block;font-size:12px;color:#e0d4e9;font-weight:700;margin:16px 0 7px}input{width:100%;border:1px solid #614a73;border-radius:12px;padding:13px 14px;background:#1a1125;color:#fff;font:inherit;outline:none}input:focus{border-color:#b18bd5;box-shadow:0 0 0 3px #a77acb28}
button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:22px;background:linear-gradient(100deg,#8960b4,#a47acb);color:white;font-weight:800;font-size:13px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:20px;margin-top:13px;color:#f0b9c4;font-size:12px}.foot{margin-top:22px;color:#91819e;font-size:11px;text-align:center}
</style>
</head>
<body><main>
<div class="mark" aria-hidden="true">✦</div><div class="eyebrow">A little space for you</div>
<h1>Welcome back.</h1><p>Your wellbeing space is waiting. Take a breath, then sign in.</p>
<form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="32"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Sign in</button><div class="message" id="message" role="status" aria-live="polite"></div></form>
<div class="foot">Private by design · Your space, your pace</div></main>
<script>
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
if(window.caches) caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));
document.querySelector("#login").addEventListener("submit",async e=>{e.preventDefault();const button=document.querySelector("#submit"),message=document.querySelector("#message");button.disabled=true;message.textContent="Signing you in…";try{const response=await fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.querySelector("#username").value,password:document.querySelector("#password").value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to sign in.");location.replace("/");}catch(error){message.textContent=error.message;button.disabled=false;}});
</script></body></html>
