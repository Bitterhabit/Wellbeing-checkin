<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21132f"><title>Set up your account · Wellbeing</title><link rel="stylesheet" href="/auth.css"></head>
<body><main><div class="mark">✦</div><div class="eyebrow">First-time setup</div><h1>Create your private account.</h1><p>This one-time setup creates the only account. Registration closes after account creation.</p>
<form id="setup"><label for="key">One-time setup key</label><input id="key" type="password" autocomplete="off" required><label for="username">Username</label><input id="username" autocomplete="username" minlength="3" maxlength="32" pattern="[a-zA-Z0-9._-]+" required><label for="password">Password (at least 12 characters)</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required><button id="submit">Create account</button><div class="message" id="message" role="status" aria-live="polite"></div></form><div class="foot">Your setup key becomes invalid after account creation.</div></main><script src="/setup.js" defer></script></body></html>
